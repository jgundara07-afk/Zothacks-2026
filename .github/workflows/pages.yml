name: Deploy OneThing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: node --test tests/*.test.js
        working-directory: frontend
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo 'Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY Actions secret.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          const endpoint = new URL('/auth/v1/settings', process.env.VITE_SUPABASE_URL);
          const response = await fetch(endpoint, {
            headers: { apikey: process.env.VITE_SUPABASE_PUBLISHABLE_KEY },
          });
          if (!response.ok) throw new Error(`Supabase Auth is unavailable (${response.status}).`);
          const settings = await response.json();
          if (settings.disable_signup) throw new Error('Supabase signups are disabled.');
          console.log('Supabase Auth is reachable and signups are enabled.');
          JS
          npm run build -- --base="/${{ github.event.repository.name }}/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
